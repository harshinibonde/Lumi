<style>
        body { font-family: 'Manrope', sans-serif; }
        .font-newsreader { font-family: 'Newsreader', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .luminous-halo {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(226, 195, 117, 0.12) 0%, rgba(255, 249, 238, 0) 70%);
            z-index: -1;
            filter: blur(40px);
        }
        .ambient-shadow {
            box-shadow: 0 24px 40px rgba(29, 28, 21, 0.04);
        }
    </style>

<body class="bg-background text-on-surface min-h-screen flex flex-col relative overflow-hidden">
<!-- Luminous Halos for Atmosphere -->
<div class="luminous-halo -top-48 -left-48"></div>
<div class="luminous-halo bottom-0 -right-48"></div>
<!-- Navigation Suppressed for Transactional Focus per "Semantic Shell Mandate" -->
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-6 py-12 relative z-10">
<div class="w-full max-w-md">
<!-- Brand Anchor / Header -->
<div class="text-center mb-12">
<div class="inline-flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="light_mode">light_mode</span>
</div>
<h1 class="font-newsreader italic text-5xl md:text-6xl text-primary tracking-tight leading-tight">
                    Welcome Back
                </h1>
<p class="font-body text-on-surface-variant/80 mt-4 text-lg">
                    Return to your sanctuary of mindfulness.
                </p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 md:p-10 ambient-shadow relative border border-outline-variant/10">
<form class="space-y-8">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label text-[0.7rem] uppercase tracking-[0.15em] text-primary font-bold ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-high border-none rounded-xl px-5 py-4 focus:ring-0 focus:bg-surface-container focus:transition-colors duration-300 placeholder:text-on-surface-variant/40 text-on-surface" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end">
<label class="font-label text-[0.7rem] uppercase tracking-[0.15em] text-primary font-bold ml-1" for="password">Password</label>
<a class="font-label text-[0.75rem] text-secondary hover:text-on-secondary-container transition-colors duration-300" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-high border-none rounded-xl px-5 py-4 focus:ring-0 focus:bg-surface-container focus:transition-colors duration-300 placeholder:text-on-surface-variant/40 text-on-surface" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Sign In Action -->
<div class="pt-2">
<button class="w-full bg-primary-container text-on-primary font-body font-semibold py-4 rounded-xl hover:bg-primary transition-all duration-300 active:scale-[0.98] ambient-shadow" type="submit">
                            Sign In
                        </button>
</div>
</form>
<!-- Divider Alternative: Tonal Shift Section -->
<div class="mt-10 pt-8 border-t-0 text-center">
<p class="text-on-surface-variant/70 font-body text-sm">
                        New to Lumi? 
                        <a class="text-secondary font-bold ml-1 hover:underline underline-offset-4 decoration-secondary/30 transition-all" href="#">Create Account</a>
</p>
</div>
</div>
<!-- Subtle Decorative Insight/Quote -->
<div class="mt-12 text-center px-4">
<p class="font-newsreader italic text-on-surface-variant/60 text-lg leading-relaxed">
                    "Healing is not a destination, but a journey taken one breath at a time."
                </p>
</div>
</div>
</main>
<!-- Footer - Simplified for Focus -->
<footer class="w-full py-10 px-12 bg-transparent">
<div class="max-w-screen-2xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
<div class="flex items-center gap-2">
<span class="font-newsreader italic text-xl font-medium text-primary">Lumi</span>
<span class="text-on-surface-variant/30 font-light text-sm">|</span>
<p class="text-on-surface-variant/60 font-body text-sm tracking-wide">A Gentle Light for Your Mind</p>
</div>
<div class="flex gap-8">
<a class="text-on-surface-variant/60 hover:text-primary transition-all font-body text-sm" href="#">Privacy</a>
<a class="text-on-surface-variant/60 hover:text-primary transition-all font-body text-sm" href="#">Terms</a>
<a class="text-on-surface-variant/60 hover:text-primary transition-all font-body text-sm" href="#">Contact</a>
</div>
</div>
</footer>
<!-- Imagery Integration (Editorial Layering) -->
<div class="absolute top-20 right-[-100px] opacity-20 pointer-events-none hidden lg:block">
