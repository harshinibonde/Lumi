[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && python -c \"from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')\" && python train_model.py"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT --log-level debug"
restartPolicyType = "ON_FAILURE"
